[project]
name = "tavily-search-mcp"
version = "0.1.0"
description = "MCP server that exposes Tavily /search and /extract as tools for any modern AI agent. Built on FastMCP 4.0.11 against MCP 2026-07-28."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tavily-search-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "tavily", "search", "extract", "fastmcp"]
dependencies = [
    "fastmcp==4.0.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tavily-search-mcp = "tavily_search_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavily_search_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
